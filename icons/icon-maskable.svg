<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Source for the maskable icon (Android crops it to a circle or squircle)
       and the Apple touch icon. Full-bleed background, mark kept in the safe zone.
       Run scripts/make-icons.sh after editing. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 256) scale(0.78) translate(-256 -256)">
    <g fill="#ffffff">
      <rect x="126" y="112" width="68" height="288" rx="16"/>
      <rect x="126" y="112" width="210" height="68" rx="16"/>
      <rect x="126" y="226" width="170" height="64" rx="16"/>
    </g>
    <circle cx="264" cy="356" r="32" fill="#3b82f6" stroke="#ffffff" stroke-width="7"/>
    <rect x="325" y="331" width="50" height="50" rx="7" fill="#fbbf24" transform="rotate(45 350 356)"/>
  </g>
</svg>
