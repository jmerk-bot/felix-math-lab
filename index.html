<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090d16">
  <meta name="description" content="Visual and spatial arithmetic lab">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Felix's Lab">
  <title>Felix's Math Lab</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="fonts/atkinson-hyperlegible-next-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header>
    <div class="brand">
      <button id="home-btn" class="home-btn" data-action="home" aria-label="Home" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 11.5L12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/>
        </svg>
      </button>
      <div class="brand-icon">F</div>
      <h1 id="app-title">Felix's Lab</h1>
    </div>
    <div id="math-tabs" class="mode-toggle" hidden>
      <button id="tab-lab" class="mode-btn active" data-action="mode" data-value="lab">Explore</button>
      <button id="tab-quest" class="mode-btn" data-action="mode" data-value="quest">Mystery Quest 🎯</button>
    </div>
  </header>

  <main class="app-container">
    <!-- HOME: pick Words or Math -->
    <div id="view-home" class="view home">
      <button class="home-card home-words" data-action="pick-words">
        <span class="home-visual" aria-hidden="true">
          <span class="tile tile-consonant">c</span><span class="tile tile-vowel">a</span><span class="tile tile-consonant">t</span>
        </span>
        <span class="home-label">Words</span>
      </button>
      <button class="home-card home-math" data-action="pick-math">
        <span class="home-visual" aria-hidden="true">
          <span class="num-a">1</span><span class="op-symbol">+</span><span class="num-b">2</span>
        </span>
        <span class="home-label">Math</span>
      </button>
    </div>

    <!-- WORDS: spelling -->
    <div id="view-spell" class="view" hidden>
      <section class="card spell-card">
        <div class="quest-toolbar spell-toolbar">
          <div id="spell-levels" class="filter-pills-row">
            <span class="toolbar-label">WORDS:</span>
            <button class="level-pill active" data-action="spell-level" data-value="cat">cat</button>
            <button class="level-pill active" data-action="spell-level" data-value="ship">ship</button>
            <button class="level-pill active" data-action="spell-level" data-value="frog">frog</button>
          </div>
          <span id="spell-bonus" class="bonus-chip" hidden>⭐ Word break</span>
          <div class="toolbar-right">
            <span id="spell-tag" class="quest-tag" hidden></span>
            <button class="skip-btn" data-action="spell-skip">Skip ↻</button>
          </div>
        </div>

        <div class="spell-main">
          <div class="spell-prompt">
            <!-- Tap the picture or the speaker to hear the word again -->
            <button id="spell-pic" class="spell-pic" data-action="spell-say" aria-label="Hear the word"></button>
            <button class="say-btn" data-action="spell-say" aria-label="Hear the word">
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/>
                <path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>
              </svg>
            </button>
          </div>
          <div class="spell-work">
            <div id="spell-boxes" class="sound-boxes"></div>
            <div id="spell-keyboard" class="tile-keyboard" role="group" aria-label="Letter tiles"></div>
            <div id="spell-solved" class="quest-solved-controls" hidden>
              <button id="spell-next" class="next-quest-btn" data-action="spell-next">Next Word ➔</button>
            </div>
          </div>
        </div>
      </section>
    </div>

    <!-- Active quest reminder, shown inside the Lab -->
    <div id="lab-quest-banner" class="quest-banner" hidden>
      <div class="banner-body">
        <!-- The quest itself, with the ? still hidden (filled by renderQuestBanner) -->
        <div id="banner-equation" class="banner-equation"></div>
        <p id="banner-hint" class="banner-hint"></p>
      </div>
      <button class="banner-btn" data-action="mode" data-value="quest">Back to Quest ➔</button>
    </div>

    <!-- VIEW 1: EXPLORE LAB -->
    <div id="view-lab" class="view" hidden>
      <section class="card">
        <div class="equation-bar">
          <div class="equation-display">
            <span id="display-a" class="num-a">6</span>
            <span id="display-op" class="op-symbol">+</span>
            <span id="display-b" class="num-b">3</span>
            <span class="equals">=</span>
            <span id="display-result" class="result-badge">9</span>
            <span id="display-remainder" class="remainder-badge" hidden>R 0</span>
          </div>
          <div class="op-selector-group">
            <button class="op-btn active" data-action="lab-op" data-value="+">+</button>
            <button class="op-btn" data-action="lab-op" data-value="-">−</button>
            <button class="op-btn" data-action="lab-op" data-value="×">×</button>
            <button class="op-btn" data-action="lab-op" data-value="÷">÷</button>
          </div>
        </div>
      </section>

      <!-- Steppers -->
      <section class="controls-grid">
        <div class="control-box">
          <div class="control-header">
            <div class="swatch-circle"></div>
            <span id="label-a" class="control-label">First (A)</span>
          </div>
          <!-- − value + for small numbers, or one ▲▼ column per place value (renderLab) -->
          <div id="stepper-a" class="stepper-row"></div>
        </div>

        <div class="control-box">
          <div class="control-header">
            <div class="swatch-diamond"></div>
            <span id="label-b" class="control-label">Second (B)</span>
          </div>
          <div id="stepper-b" class="stepper-row"></div>
        </div>
      </section>

      <!-- Visual manipulative (ten-frames, base-ten blocks, place value, array, area model, sharing) -->
      <section id="manipulative-card" class="card"></section>

      <!-- Vector number line -->
      <section class="card">
        <div class="card-header-bar">
          <span>SPATIAL VECTOR LINE</span>
          <span id="vector-hint" class="vector-hint">Hop forward +3</span>
        </div>
        <div class="number-line">
          <div class="number-line-track">
            <div id="vector-segment" class="vector-fill"></div>
            <span id="vector-marker" class="vector-marker"></span>
          </div>
          <div id="vector-ticks" class="ticks-container"></div>
        </div>
      </section>
    </div>

    <!-- VIEW 2: MYSTERY QUEST -->
    <div id="view-quest" class="view" hidden>
      <div class="quest-layout">
      <section class="card quest-card">
        <div class="quest-toolbar">
          <div class="filter-pills-row">
            <span class="toolbar-label">OPERATIONS:</span>
            <button class="filter-pill active" data-action="quest-filter" data-value="+">+</button>
            <button class="filter-pill active" data-action="quest-filter" data-value="-">−</button>
            <button class="filter-pill active" data-action="quest-filter" data-value="×">×</button>
            <button class="filter-pill active" data-action="quest-filter" data-value="÷">÷</button>
          </div>
          <div class="toolbar-right">
            <span id="quest-tag-status" class="quest-tag" hidden></span>
            <button class="skip-btn" data-action="quest-skip">Skip ↻</button>
          </div>
        </div>

        <div class="quest-equation">
          <span id="quest-num-a" class="num-a">7</span>
          <span id="quest-op-badge" class="op-symbol">+</span>
          <span id="quest-slot-b"></span>
          <span class="equals">=</span>
          <span id="quest-slot-result"></span>
        </div>

        <div id="quest-active-controls" class="quest-active-controls">
          <!-- On-screen number pad. Digits fill the mystery box, so the tablet keyboard never opens. -->
          <div class="keypad" role="group" aria-label="Number pad">
            <button class="key" data-action="key" data-value="1">1</button>
            <button class="key" data-action="key" data-value="2">2</button>
            <button class="key" data-action="key" data-value="3">3</button>
            <button class="key" data-action="key" data-value="4">4</button>
            <button class="key" data-action="key" data-value="5">5</button>
            <button class="key" data-action="key" data-value="6">6</button>
            <button class="key" data-action="key" data-value="7">7</button>
            <button class="key" data-action="key" data-value="8">8</button>
            <button class="key" data-action="key" data-value="9">9</button>
            <button class="key key-back" data-action="key" data-value="back" aria-label="Delete">
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 5H8.5L3 12l5.5 7H21a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/>
                <path d="M11.5 9.5l5 5M16.5 9.5l-5 5"/>
              </svg>
            </button>
            <button class="key" data-action="key" data-value="0">0</button>
            <button class="key key-solve" data-action="key" data-value="solve" aria-label="Solve">
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12.5l4.5 4.5L19 7.5"/>
              </svg>
            </button>
          </div>
          <button class="send-lab-btn" data-action="quest-to-lab">🧪 Test &amp; Explore this in the Lab</button>
        </div>

        <div id="quest-solved-controls" class="quest-solved-controls" hidden>
          <button class="next-quest-btn" data-action="quest-next">Next Quest 🚀</button>
        </div>

        <div class="clue-panel">
          <span class="clue-label">PROBLEM GUIDE:</span>
          <p id="quest-guide-text" class="clue-text"></p>
        </div>
      </section>

      <!-- Climbing meter: difficulty from 1 (early 2nd grade, bottom) to 5 (5th grade, top) -->
      <div class="level-rail" role="group" aria-label="Level">
        <button class="level-step" data-action="quest-level" data-value="5" aria-label="Level 5"><span class="level-bars"><i></i><i></i><i></i><i></i><i></i></span><span class="level-num">5</span></button>
        <button class="level-step" data-action="quest-level" data-value="4" aria-label="Level 4"><span class="level-bars"><i></i><i></i><i></i><i></i></span><span class="level-num">4</span></button>
        <button class="level-step" data-action="quest-level" data-value="3" aria-label="Level 3"><span class="level-bars"><i></i><i></i><i></i></span><span class="level-num">3</span></button>
        <button class="level-step" data-action="quest-level" data-value="2" aria-label="Level 2"><span class="level-bars"><i></i><i></i></span><span class="level-num">2</span></button>
        <button class="level-step" data-action="quest-level" data-value="1" aria-label="Level 1"><span class="level-bars"><i></i></span><span class="level-num">1</span></button>
      </div>
      </div>
    </div>
  </main>

  <footer id="app-version" class="app-version"></footer>
</body>
</html>
